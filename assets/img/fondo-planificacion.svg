<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cc0de"/>
      <stop offset="1" stop-color="#5a9ac4"/>
    </linearGradient>
    <pattern id="grilla" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ffffff" fill-opacity="0.55"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#grilla)"/>

  <!-- Objetivo: círculos concéntricos (zona derecha) -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5">
    <circle cx="1560" cy="470" r="300"/>
    <circle cx="1560" cy="470" r="215"/>
    <circle cx="1560" cy="470" r="130"/>
    <circle cx="1560" cy="470" r="50"/>
    <path d="M1560 130V810M1220 470H1900" stroke-dasharray="6 10"/>
  </g>
  <circle cx="1560" cy="470" r="12" fill="#ffffff" fill-opacity="0.7"/>

  <!-- Ruta estratégica: nodos de decisión hacia el objetivo -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 900 L430 780" marker-end="url(#flecha)"/>
    <path d="M430 780 L640 860" marker-end="url(#flecha)"/>
    <path d="M430 780 L560 560" marker-end="url(#flecha)" stroke-dasharray="3 9" stroke-opacity="0.35"/>
    <path d="M640 860 L900 700" marker-end="url(#flecha)"/>
    <path d="M900 700 L1120 760" marker-end="url(#flecha)" stroke-dasharray="3 9" stroke-opacity="0.35"/>
    <path d="M900 700 L1130 520" marker-end="url(#flecha)"/>
    <path d="M1130 520 L1510 470" marker-end="url(#flecha)"/>
  </g>
  <g fill="#ffffff">
    <circle cx="140" cy="900" r="9" fill-opacity="0.8"/>
    <circle cx="430" cy="780" r="13" fill-opacity="0.8"/>
    <circle cx="640" cy="860" r="13" fill-opacity="0.8"/>
    <circle cx="900" cy="700" r="13" fill-opacity="0.8"/>
    <circle cx="1130" cy="520" r="13" fill-opacity="0.8"/>
    <circle cx="560" cy="560" r="9" fill-opacity="0.35"/>
    <circle cx="1120" cy="760" r="9" fill-opacity="0.35"/>
  </g>

  <!-- Triángulo de gobierno (Matus): proyecto, capacidad de gobierno, gobernabilidad -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2">
    <path d="M300 120 L520 500 L80 500 Z"/>
    <path d="M300 120 L300 500" stroke-dasharray="4 8"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="300" cy="120" r="7"/>
    <circle cx="520" cy="500" r="7"/>
    <circle cx="80" cy="500" r="7"/>
  </g>

  <!-- Cuadro táctico: marcas de ajedrez/mesa de planeamiento (esquina superior central) -->
  <g fill="#ffffff" fill-opacity="0.09">
    <rect x="800" y="80" width="80" height="80"/><rect x="960" y="80" width="80" height="80"/>
    <rect x="880" y="160" width="80" height="80"/><rect x="1040" y="160" width="80" height="80"/>
    <rect x="800" y="240" width="80" height="80"/><rect x="960" y="240" width="80" height="80"/>
  </g>
</svg>
