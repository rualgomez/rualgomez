  <main class="container px-3 my-3 my-md-4 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-3 p-md-4">
            <h1 class="mb-1" style="font-size:clamp(1.5rem,4vw,2rem); font-family:'Roboto',sans-serif; font-weight:bold;">Inscripción a cursos</h1>
            <p class="text-secondary mb-4">Los campos marcados con * son obligatorios.</p>

            <form>
              <h2 class="h5 mb-3">Datos personales</h2>
              <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                  <label for="nombre" class="form-label">Nombre *</label>
                  <input type="text" class="form-control" id="nombre" placeholder="María" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="apellido" class="form-label">Apellido *</label>
                  <input type="text" class="form-control" id="apellido" placeholder="Gómez" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="dni" class="form-label">DNI *</label>
                  <input type="text" class="form-control" id="dni" placeholder="30123456" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="nacimiento" class="form-label">Fecha de nacimiento</label>
                  <input type="date" class="form-control" id="nacimiento">
                </div>
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label">Correo electrónico *</label>
                  <input type="email" class="form-control" id="email" placeholder="nombre@empresa.com" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input type="tel" class="form-control" id="telefono" placeholder="223 555 0123">
                </div>
              </div>

              <h2 class="h5 mb-3">Datos profesionales</h2>
              <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                  <label for="empresa" class="form-label">Empresa *</label>
                  <input type="text" class="form-control" id="empresa" placeholder="Nombre de la empresa" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="cargo" class="form-label">Cargo *</label>
                  <input type="text" class="form-control" id="cargo" placeholder="Gerente comercial" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="comentarios" class="form-label">Comentarios</label>
                <textarea class="form-control" id="comentarios" rows="3" placeholder="Contanos qué esperás del curso"></textarea>
              </div>

              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="acepto" required>
                <label class="form-check-label" for="acepto">Acepto los términos y condiciones *</label>
              </div>
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="novedades">
                <label class="form-check-label" for="novedades">Quiero recibir novedades por correo</label>
              </div>

              <div class="d-grid d-md-block">
                <button type="submit" class="btn boton-reserva">Enviar inscripción</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
